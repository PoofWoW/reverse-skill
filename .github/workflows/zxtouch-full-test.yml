# Isolated ZXTouch build: existing host repository scripts are not executed.
name: ZXTouch Rootless iOS 16.1.1 full test build
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [ 'touch-diagnostics', 'fix/ios16-mixed-touch' ]
  pull_request:
    paths:
      - 'pccontrol/**'
      - 'zxtouch/**'
      - 'layout/**'
      - 'diagnostics/**'
      - 'tests/**'
      - 'tools/**'
      - 'Makefile'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: zxtouch-ci
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: SANITIZE=1 python -m unittest discover -s tests -v
  full-rootless-deb:
    needs: tests
    runs-on: macos-15
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/theos
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash
        working-directory: zxtouch-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install signing and packaging tools
        run: brew install ldid xz
      - name: Install pinned Theos and iOS SDK
        run: |
          set -euo pipefail
          git clone https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" checkout 958fea4f779943505b15b93c88bb4db8d97b346d
          git -C "$THEOS" submodule update --init --recursive
          curl -fL --retry 3 https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o sdk.tar.xz
          echo '5e0fd3f01266cce4ce012d4a99b38eb56578fca40d09edc81cd83dee958202fb  sdk.tar.xz' | shasum -a 256 -c -
          mkdir -p "$THEOS/sdks"
          tar -xJf sdk.tar.xz -C "$THEOS/sdks"
      - name: Verify Apple compiler and actual arm64e object ABI
        run: python3 tools/check_apple_toolchain.py
      - name: Build and sign management app and extension from source
        run: |
          set -euo pipefail
          xcodebuild -project zxtouch/zxtouch.xcodeproj -target zxtouch \
            -sdk iphoneos -configuration Release SYMROOT="$PWD/app-build" \
            ONLY_ACTIVE_ARCH=NO ARCHS="arm64 arm64e" IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcode-touch.log
          APP=app-build/Release-iphoneos/zxtouch.app
          test -x "$APP/zxtouch"
          test -x "$APP/PlugIns/shortcutext.appex/shortcutext"
          ldid -Szxtouch/app-entitlements.plist "$APP/zxtouch"
          ldid -Szxtouch/shortcutext-entitlements.plist "$APP/PlugIns/shortcutext.appex/shortcutext"
          rm -f "$APP/embedded.mobileprovision" "$APP/PlugIns/shortcutext.appex/embedded.mobileprovision"
          rm -rf layout/Applications/zxtouch.app
          cp -R "$APP" layout/Applications/zxtouch.app
      - name: Build full patched ZXTouch (SpringBoard injection only)
        run: |
          set -euo pipefail
          umask 022
          make clean ZX_TOUCH_DIAGNOSTICS=1
          make package THEOS_PACKAGE_SCHEME=rootless ZX_TOUCH_DIAGNOSTICS=1 FINALPACKAGE=1 \
            ZX_TOUCH_BUILD_COMMIT="$GITHUB_SHA" \
            PACKAGE_VERSION="1.0.1~touchtest.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}+${GITHUB_SHA:0:7}" \
            2>&1 | tee theos-touch.log
      - name: Audit and collect full candidate only
        run: |
          set -euo pipefail
          mkdir -p artifacts/diagnostics
          DEBS=(packages/*.deb)
          test "${#DEBS[@]}" -eq 1
          DEB=artifacts/ZXTouch-ios16.1.1-rootless-touch-test.deb
          cp "${DEBS[0]}" "$DEB"
          python3 tools/normalize_deb_ownership.py "$DEB"
          python3 tools/audit_touch_deb.py "$DEB" --expected-commit "$GITHUB_SHA" > artifacts/package-audit.json
          cp diagnostics/touch-probe.html diagnostics/mixed_touch.py artifacts/diagnostics/
          cp docs/*.md artifacts/
          cp toolchain-info.json xcode-touch.log theos-touch.log artifacts/
          git rev-parse HEAD > artifacts/source-commit.txt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          info = {'sourceCommit':os.environ['GITHUB_SHA'], 'repository':os.environ['GITHUB_REPOSITORY'],
                  'runURL':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
                  'package':'ZXTouch-ios16.1.1-rootless-touch-test.deb', 'containsFullZXTouch':True,
                  'deviceValidated':False,'foregroundReceiptVerified':False,'mixedTouchValidated':False}
          Path('artifacts/build-info.json').write_text(json.dumps(info, indent=2)+'\n')
          PY
          (cd artifacts && shasum -a 256 ZXTouch-ios16.1.1-rootless-touch-test.deb > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ZXTouch-ios16.1.1-rootless-full-UNVALIDATED
          path: zxtouch-ci/artifacts/
          if-no-files-found: error
      - name: Preserve failure and compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touch-build-logs
          path: |
            zxtouch-ci/toolchain-info.json
            zxtouch-ci/xcode-touch.log
            zxtouch-ci/theos-touch.log
